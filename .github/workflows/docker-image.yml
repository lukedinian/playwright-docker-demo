name: Deploy Playwright Service


on:
  push:
    branches:
      - main


jobs:

  deploy:

    name: Build and Run Docker Container

    runs-on:
      - self-hosted
      - Windows


    steps:


    # 拉取代码
    - name: Checkout code
      uses: actions/checkout@v4



    # 查看当前目录，确认 Dockerfile
    - name: Check project files
      shell: powershell
      run: |

        pwd
        dir



    # 构建 Docker 镜像
    - name: Build Docker image
      shell: powershell
      run: |

        docker build -t playwright-test:latest .



    # 删除旧容器
    - name: Remove old container
      shell: powershell
      run: |

        $container = docker ps -aq -f name=playwright-service

        if ($container) {

            docker rm -f playwright-service

            Write-Host "Old container removed."

        }
        else {

            Write-Host "No old container found."

        }



    # 后台启动新容器
    - name: Start container
      shell: powershell
      run: |

        docker run -d `
          --name playwright-service `
          --restart always `
          playwright-test:latest


        if ($LASTEXITCODE -ne 0) {

            Write-Error "Container start failed"

            exit 1

        }



    # 查看运行状态
    - name: Verify container
      shell: powershell
      run: |

        docker ps

        docker logs --tail 50 playwright-service



    # 完成
    - name: Deployment finished
      shell: powershell
      run: |

        Write-Host "Deployment completed."
        Write-Host "Container keeps running."