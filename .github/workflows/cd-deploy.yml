name: CD — Run tests with docker-compose on self-hosted runner

on:
  push:
    branches:
      - main

jobs:
  run-tests:
    name: Run tests on self-hosted runner
    runs-on: [self-hosted, windows]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build services (docker compose)
        shell: pwsh
        run: |
          # Detect whether to use 'docker compose' (v2) or 'docker-compose' (v1)
          if (Get-Command 'docker' -ErrorAction SilentlyContinue) {
            try {
              docker compose version > $null 2>&1
              $composeCmd = 'docker compose'
            } catch {
              $composeCmd = 'docker-compose'
            }
          } else {
            Write-Error "Docker CLI not found"
            exit 1
          }
          Write-Host "Using compose command: $composeCmd"
          & $composeCmd build

      - name: Run tests (docker compose) and return exit code
        shell: pwsh
        run: |
          if (Get-Command 'docker' -ErrorAction SilentlyContinue) {
            try {
              docker compose version > $null 2>&1
              $composeCmd = 'docker compose'
            } catch {
              $composeCmd = 'docker-compose'
            }
          } else {
            Write-Error "Docker CLI not found"
            exit 1
          }

          Write-Host "Starting services and running tests..."
          & $composeCmd up --abort-on-container-exit --exit-code-from test
          $exit = $LASTEXITCODE

          Write-Host "Tests finished with exit code: $exit. Tearing down..."
          & $composeCmd down --volumes --remove-orphans

          exit $exit
