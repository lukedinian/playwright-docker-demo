name: CD — Run tests with docker-compose on self-hosted runner

on:
  push:
    branches:
      - main

jobs:
  run-tests:
    name: Run tests on self-hosted runner
    runs-on: [self-hosted, windows]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Detect compose command on Windows (PowerShell)
      - name: Detect compose command (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          if (Get-Command 'docker' -ErrorAction SilentlyContinue) {
                  try { docker compose version > $null 2>&1; $bin = 'docker'; $args = 'compose' } catch { $bin = 'docker-compose'; $args = '' }
          } else {
            Write-Error "Docker CLI not found"
            exit 1
          }
                Add-Content -Path $env:GITHUB_ENV -Value "COMPOSE_BIN=$bin"
                Add-Content -Path $env:GITHUB_ENV -Value "COMPOSE_ARGS=$args"
                Write-Host "COMPOSE_BIN set to: $bin"
                Write-Host "COMPOSE_ARGS set to: $args"

      # Detect compose command on Linux/macOS
      - name: Detect compose command (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          if command -v docker >/dev/null 2>&1; then
            if docker compose version >/dev/null 2>&1; then COMPOSE_CMD='docker compose'; else COMPOSE_CMD='docker-compose'; fi
          else
            echo "Docker CLI not found" >&2
            exit 1
          fi
          echo "COMPOSE_CMD=$COMPOSE_CMD" >> $GITHUB_ENV
          echo "COMPOSE_CMD set to: $COMPOSE_CMD"

      # Build services (platform-specific invocation)
      - name: Cleanup previous compose state (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
                Write-Host "Cleaning previous compose stacks if any..."
                if ($env:COMPOSE_ARGS -ne '') { & $env:COMPOSE_BIN $env:COMPOSE_ARGS down --volumes --remove-orphans } else { & $env:COMPOSE_BIN down --volumes --remove-orphans }

      - name: Cleanup previous compose state (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
                echo "Cleaning previous compose stacks if any..."
                $COMPOSE_CMD down --volumes --remove-orphans || true

      - name: Build services (docker compose)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
                Write-Host "Using: $env:COMPOSE_BIN $env:COMPOSE_ARGS"
                if ($env:COMPOSE_ARGS -ne '') { & $env:COMPOSE_BIN $env:COMPOSE_ARGS build } else { & $env:COMPOSE_BIN build }

      - name: Build services (docker compose - Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
                echo "Using: $COMPOSE_CMD"
                $COMPOSE_CMD build

      # Run tests and return exit code (Windows)
      - name: Run tests (docker compose) and return exit code (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          Write-Host "Starting services and running tests..."
                if ($env:COMPOSE_ARGS -ne '') { & $env:COMPOSE_BIN $env:COMPOSE_ARGS up --abort-on-container-exit --exit-code-from test } else { & $env:COMPOSE_BIN up --abort-on-container-exit --exit-code-from test }
          $exit = $LASTEXITCODE

          Write-Host "Tests finished with exit code: $exit. Tearing down..."
                if ($env:COMPOSE_ARGS -ne '') { & $env:COMPOSE_BIN $env:COMPOSE_ARGS down --volumes --remove-orphans } else { & $env:COMPOSE_BIN down --volumes --remove-orphans }

          exit $exit

      # Run tests and return exit code (Unix)
      - name: Run tests (docker compose) and return exit code (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          echo "Starting services and running tests..."
          $COMPOSE_CMD up --abort-on-container-exit --exit-code-from test
          exit_code=$?

          echo "Tests finished with exit code: $exit_code. Tearing down..."
          $COMPOSE_CMD down --volumes --remove-orphans

          exit $exit_code
