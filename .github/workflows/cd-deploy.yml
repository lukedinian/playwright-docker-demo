name: CD — Deploy with docker-compose on self-hosted runner

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy services on self-hosted runner
    runs-on: [self-hosted, windows]

    steps:

      # 拉取代码
      - name: Checkout code
        uses: actions/checkout@v4


      # 检测 docker compose
      - name: Detect compose command
        shell: powershell
        run: |
          if (Get-Command docker -ErrorAction SilentlyContinue) {

            docker compose version > $null 2>&1

            if ($LASTEXITCODE -eq 0) {
              $bin = "docker"
              $args = "compose"
            }
            else {
              $bin = "docker-compose"
              $args = ""
            }

          }
          else {
            Write-Error "Docker CLI not found"
            exit 1
          }


          Add-Content $env:GITHUB_ENV "COMPOSE_BIN=$bin"
          Add-Content $env:GITHUB_ENV "COMPOSE_ARGS=$args"


          Write-Host "Compose command:"
          Write-Host "$bin $args"



      # 停止旧服务
      - name: Stop old services
        shell: powershell
        run: |

          Write-Host "Stopping old compose services..."

          if ($env:COMPOSE_ARGS -ne "") {

            & $env:COMPOSE_BIN $env:COMPOSE_ARGS down `
              --remove-orphans

          }
          else {

            & $env:COMPOSE_BIN down `
              --remove-orphans

          }


      # 构建镜像
      - name: Build services
        shell: powershell
        run: |

          Write-Host "Building docker images..."

          if ($env:COMPOSE_ARGS -ne "") {

            & $env:COMPOSE_BIN $env:COMPOSE_ARGS build

          }
          else {

            & $env:COMPOSE_BIN build

          }


          if ($LASTEXITCODE -ne 0) {
            Write-Error "Docker build failed"
            exit 1
          }



      # 后台启动服务
      - name: Start services
        shell: powershell
        run: |

          Write-Host "Starting services in background..."

          if ($env:COMPOSE_ARGS -ne "") {

            & $env:COMPOSE_BIN $env:COMPOSE_ARGS up -d

          }
          else {

            & $env:COMPOSE_BIN up -d

          }


          if ($LASTEXITCODE -ne 0) {
            Write-Error "Docker compose start failed"
            exit 1
          }


          Write-Host "Services started successfully"



      # 查看状态
      - name: Verify services
        shell: powershell
        run: |

          Write-Host "Checking running containers..."

          if ($env:COMPOSE_ARGS -ne "") {

            & $env:COMPOSE_BIN $env:COMPOSE_ARGS ps

          }
          else {

            & $env:COMPOSE_BIN ps

          }


          Write-Host "Deployment finished."